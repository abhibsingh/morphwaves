<svg viewBox="0 0 1000 470" role="img" aria-labelledby="arch-title arch-desc" xmlns="http://www.w3.org/2000/svg"><title id="arch-title">GroundOps concept architecture</title><desc id="arch-desc">Concept diagram. On the left, ground station equipment: antenna and RF, modems and baseband, and station control software. These connect through adapters into the proposed GroundOps environment in the centre, which contains six modules: pass planning, station health, telemetry validation, alerts and diagnostics, API integrations, and automated testing. On the right, GroundOps connects through APIs to existing systems: mission control, scheduling tools, data pipelines, and alerting and on call tools.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker></defs><text x="30" y="36" font-size="13" font-weight="600" fill="#3B4A5E" text-anchor="start">Ground station</text><text x="970" y="36" font-size="13" font-weight="600" fill="#3B4A5E" text-anchor="end">Your existing systems</text><rect x="30" y="60" width="196" height="64" rx="8" fill="#F7F9FC" stroke="#DCE4ED" stroke-width="1.25"/><text x="128" y="97" font-size="14" font-weight="500" fill="#081626" text-anchor="middle">Antenna and RF</text><rect x="30" y="160" width="196" height="64" rx="8" fill="#F7F9FC" stroke="#DCE4ED" stroke-width="1.25"/><text x="128" y="197" font-size="14" font-weight="500" fill="#081626" text-anchor="middle">Modems and baseband</text><rect x="30" y="260" width="196" height="64" rx="8" fill="#F7F9FC" stroke="#DCE4ED" stroke-width="1.25"/><text x="128" y="297" font-size="14" font-weight="500" fill="#081626" text-anchor="middle">Station control software</text><rect x="774" y="54" width="196" height="56" rx="8" fill="#F7F9FC" stroke="#DCE4ED" stroke-width="1.25"/><text x="872" y="87" font-size="14" font-weight="500" fill="#081626" text-anchor="middle">Mission control</text><rect x="774" y="134" width="196" height="56" rx="8" fill="#F7F9FC" stroke="#DCE4ED" stroke-width="1.25"/><text x="872" y="167" font-size="14" font-weight="500" fill="#081626" text-anchor="middle">Scheduling tools</text><rect x="774" y="214" width="196" height="56" rx="8" fill="#F7F9FC" stroke="#DCE4ED" stroke-width="1.25"/><text x="872" y="247" font-size="14" font-weight="500" fill="#081626" text-anchor="middle">Data pipelines</text><rect x="774" y="294" width="196" height="56" rx="8" fill="#F7F9FC" stroke="#DCE4ED" stroke-width="1.25"/><text x="872" y="327" font-size="14" font-weight="500" fill="#081626" text-anchor="middle">Alerting and on call</text><rect x="290" y="52" width="420" height="330" rx="12" fill="#081626" stroke="#081626" stroke-width="1.25"/><text x="314" y="88" font-size="17" font-weight="600" fill="#FFFFFF" text-anchor="start">Morphwaves GroundOps</text><text x="314" y="110" font-size="13" font-weight="400" fill="#A9B7C8" text-anchor="start">Proposed unified environment</text><rect x="314" y="136" width="178" height="64" rx="8" fill="#10243A" stroke="#22384F" stroke-width="1.25"/><circle cx="332" cy="168.0" r="4" fill="none" stroke="#16B8D4" stroke-width="1.75"/><text x="346" y="173.0" font-size="13" font-weight="500" fill="#E8EEF5" text-anchor="start">Pass planning</text><rect x="508" y="136" width="178" height="64" rx="8" fill="#10243A" stroke="#22384F" stroke-width="1.25"/><circle cx="526" cy="168.0" r="4" fill="none" stroke="#16B8D4" stroke-width="1.75"/><text x="540" y="173.0" font-size="13" font-weight="500" fill="#E8EEF5" text-anchor="start">Station health</text><rect x="314" y="214" width="178" height="64" rx="8" fill="#10243A" stroke="#22384F" stroke-width="1.25"/><circle cx="332" cy="246.0" r="4" fill="none" stroke="#16B8D4" stroke-width="1.75"/><text x="346" y="251.0" font-size="13" font-weight="500" fill="#E8EEF5" text-anchor="start">Telemetry validation</text><rect x="508" y="214" width="178" height="64" rx="8" fill="#10243A" stroke="#22384F" stroke-width="1.25"/><circle cx="526" cy="246.0" r="4" fill="none" stroke="#16B8D4" stroke-width="1.75"/><text x="540" y="251.0" font-size="13" font-weight="500" fill="#E8EEF5" text-anchor="start">Alerts and diagnostics</text><rect x="314" y="292" width="178" height="64" rx="8" fill="#10243A" stroke="#22384F" stroke-width="1.25"/><circle cx="332" cy="324.0" r="4" fill="none" stroke="#16B8D4" stroke-width="1.75"/><text x="346" y="329.0" font-size="13" font-weight="500" fill="#E8EEF5" text-anchor="start">API integrations</text><rect x="508" y="292" width="178" height="64" rx="8" fill="#10243A" stroke="#22384F" stroke-width="1.25"/><circle cx="526" cy="324.0" r="4" fill="none" stroke="#16B8D4" stroke-width="1.75"/><text x="540" y="329.0" font-size="13" font-weight="500" fill="#E8EEF5" text-anchor="start">Automated testing</text><path d="M228 92 C 256 92, 260 217.0, 288 217.0" fill="none" stroke="#64748B" stroke-width="1.25" marker-end="url(#arr)"/><path d="M228 192 C 256 192, 260 217.0, 288 217.0" fill="none" stroke="#64748B" stroke-width="1.25" marker-end="url(#arr)"/><path d="M228 292 C 256 292, 260 217.0, 288 217.0" fill="none" stroke="#64748B" stroke-width="1.25" marker-end="url(#arr)"/><path d="M712 217.0 C 740 217.0, 744 82, 772 82" fill="none" stroke="#64748B" stroke-width="1.25" marker-end="url(#arr)"/><path d="M712 217.0 C 740 217.0, 744 162, 772 162" fill="none" stroke="#64748B" stroke-width="1.25" marker-end="url(#arr)"/><path d="M712 217.0 C 740 217.0, 744 242, 772 242" fill="none" stroke="#64748B" stroke-width="1.25" marker-end="url(#arr)"/><path d="M712 217.0 C 740 217.0, 744 322, 772 322" fill="none" stroke="#64748B" stroke-width="1.25" marker-end="url(#arr)"/><text x="258" y="384" font-size="12" font-weight="500" fill="#3B4A5E" text-anchor="middle">Adapters</text><text x="742" y="384" font-size="12" font-weight="500" fill="#3B4A5E" text-anchor="middle">APIs</text><rect x="290" y="412" width="420" height="34" rx="17" fill="#FFFFFF" stroke="#64748B" stroke-width="1.25" stroke-dasharray="4 4"/><text x="500.0" y="434" font-size="13" font-weight="600" fill="#3B4A5E" text-anchor="middle">Concept diagram. Not a product interface.</text></svg>